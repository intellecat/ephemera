# The Swift package (Package.swift, bindings/swift): tests on macOS and
# Linux, and a build for the iOS simulator.
name: Swift

on:
  push:
    branches: [main]
    paths: ["src/**", "include/**", "data/**", "bindings/swift/**", "Package.swift", ".github/workflows/swift.yml"]
  pull_request:
    paths: ["src/**", "include/**", "data/**", "bindings/swift/**", "Package.swift", ".github/workflows/swift.yml"]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Built-in data matches data/
        run: cmp data/eph-1as-chiron.bin bindings/swift/Sources/Ephemera/Resources/eph-1as-chiron.bin
      - run: swift test

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for the iOS simulator
        run: xcodebuild build -scheme Ephemera -destination 'generic/platform=iOS Simulator' -quiet
