# The Python package pyephemera: an sdist staged by `make python`, wheels
# built from it by cibuildwheel on each platform and tested there, and on a
# python-v* tag, published to PyPI (trusted publishing, no token).
name: Python

on:
  push:
    branches: [main]
    tags: ["python-v*"]
    paths: ["src/**", "include/**", "data/**", "bindings/python/**", "Makefile", ".github/workflows/python.yml"]
  pull_request:
    paths: ["src/**", "include/**", "data/**", "bindings/python/**", "Makefile", ".github/workflows/python.yml"]
  workflow_dispatch:

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make python
      - run: pipx run build --sdist build/python -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    needs: sdist
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test the wheels
        shell: bash
        env:
          CIBW_ARCHS_MACOS: x86_64 arm64
        run: pipx run cibuildwheel==2.23.3 dist/pyephemera-*.tar.gz --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    if: startsWith(github.ref, 'refs/tags/python-v')
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
