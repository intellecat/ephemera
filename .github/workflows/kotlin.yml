# The Kotlin binding (bindings/kotlin): its checks on the desktop JVM, and
# the Android library (AAR) for arm64-v8a, armeabi-v7a, x86_64 and x86.
name: Kotlin

on:
  push:
    branches: [main]
    paths: ["src/**", "include/**", "data/**", "bindings/kotlin/**", "Makefile", ".github/workflows/kotlin.yml"]
  pull_request:
    paths: ["src/**", "include/**", "data/**", "bindings/kotlin/**", "Makefile", ".github/workflows/kotlin.yml"]
  workflow_dispatch:

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Kotlin compiler
        run: |
          curl -sSLf -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.21/kotlin-compiler-2.1.21.zip
          unzip -q kotlin.zip -d "$RUNNER_TEMP"
      - run: make kotlin-test KOTLINC="$RUNNER_TEMP/kotlinc/bin/kotlinc"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the Android library
        working-directory: bindings/kotlin
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ephemera-aar
          path: bindings/kotlin/build/outputs/aar/*.aar
